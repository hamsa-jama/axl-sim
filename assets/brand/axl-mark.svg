<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AXL">
  <title>AXL</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f66"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#g)"/>
  <!-- three studs -->
  <g fill="#e9eef7">
    <circle cx="86" cy="86" r="34"/>
    <circle cx="170" cy="86" r="34"/>
    <circle cx="86" cy="170" r="34"/>
  </g>
  <g fill="#ffffff" opacity=".35">
    <ellipse cx="76" cy="74" rx="14" ry="9"/>
    <ellipse cx="160" cy="74" rx="14" ry="9"/>
    <ellipse cx="76" cy="158" rx="14" ry="9"/>
  </g>
  <!-- axle cross in the fourth position, in a round hub -->
  <circle cx="170" cy="170" r="34" fill="#0d1628"/>
  <path d="M170 146v48M146 170h48" stroke="#ff8a1f" stroke-width="16" stroke-linecap="round" fill="none"/>
