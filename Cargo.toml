[workspace]
resolver = "3"
members = [
    "crates/axl-app",
    "crates/axl-render",
    "crates/axl-parts",
    "crates/axl-build",
    "crates/axl-compile",
    "crates/axl-mujoco",
    "crates/axl-hw",
    "crates/axl-host",
    "crates/axl-code",
    "crates/axl-sim",
    "crates/axl-world",
    "crates/axl-missions",
    "crates/axl-validate",
    "xtask",
]
# sdk/rust/axl-robot is built for wasm32-wasip1 on its own (added in M7).

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hamsa-jama/axl-sim"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"

[workspace.dependencies]
# Bevy is shared by `axl-render` and `axl-app` (the only crates allowed to use it),
# so both must see exactly the same feature set. Decision record 0003 explains the pin.
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_color",
    "bevy_image",
    "bevy_shader",
    "bevy_material",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_picking",
    "mesh_picking",
    "bevy_camera_controller",
    "pan_orbit_camera",
    "png",
    "zstd_rust",
    "experimental_pbr_pcss",
    "tonemapping_luts",
] }
