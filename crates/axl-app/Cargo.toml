[package]
name = "axl-app"
description = "The AXL binary: screens, wiring, and the headless command-line mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "axl"
path = "src/main.rs"

[features]
default = ["gui"]
# The window, renderer and UI. Build with `--no-default-features` for a
# headless-only binary (used for fast iteration and for graders).
gui = ["dep:bevy", "dep:bevy_egui", "dep:axl-render", "dep:egui_plot", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axl-render = { path = "../axl-render", optional = true }
axl-build = { path = "../axl-build" }
axl-compile = { path = "../axl-compile" }
axl-parts = { path = "../axl-parts" }
axl-sim = { path = "../axl-sim" }
axl-hw = { path = "../axl-hw" }
axl-mujoco = { path = "../axl-mujoco" }
axl-host = { path = "../axl-host" }
axl-code = { path = "../axl-code" }
crossbeam-channel = "0.5"
directories = "6"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
bevy = { workspace = true, optional = true }
# The plotter (egui 0.36 pairs with egui_plot 0.37) and the CSV save dialog.
egui_plot = { version = "=0.37.0", optional = true }
rfd = { version = "0.18", optional = true }

[dependencies.bevy_egui]
version = "=0.43.1"
optional = true
default-features = false
features = ["render", "default_fonts"]
