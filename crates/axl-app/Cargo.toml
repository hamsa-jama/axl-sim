[package]
name = "axl-app"
description = "The AXL binary: screens, wiring, and the headless command-line mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "axl"
path = "src/main.rs"

[features]
default = ["gui"]
# The window, renderer and UI. Build with `--no-default-features` for a
# headless-only binary (used for fast iteration and for graders).
gui = ["dep:bevy", "dep:bevy_egui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.bevy]
version = "=0.20.1"
optional = true
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_color",
    "bevy_image",
    "bevy_shader",
    "bevy_material",
    "bevy_post_process",
    "bevy_anti_alias",
    "png",
    "tonemapping_luts",
]

[dependencies.bevy_egui]
version = "=0.43.1"
optional = true
default-features = false
features = ["render", "default_fonts"]
